<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12233a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<title>Hold-Find-Plan</title>
<style>
:root { --ink:#12233a; --muted:#5b6b80; --card:#fff; --bg:#eef3f8; --accent:#1f5f8b; --ok:#2a7a4b; --tap:48px; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); touch-action:manipulation; }
header { background:var(--ink); color:#fff; padding:16px 18px; }
h1 { margin:0; font-size:1.15rem; }
header p { margin:6px 0 0; font-size:.8rem; opacity:.85; }
main { max-width:820px; margin:0 auto; padding:16px; }
.card { background:var(--card); border-radius:14px; padding:16px; box-shadow:0 8px 24px rgba(18,35,58,.08); margin-bottom:16px; }
label { display:block; font-size:.85rem; margin:10px 0 4px; color:var(--muted); }
select, button { font:inherit; font-size:16px; }
select { width:100%; min-height:var(--tap); padding:10px; border:1px solid #c9d4e0; border-radius:10px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ .row { grid-template-columns:1fr; } }
button { border:0; border-radius:12px; min-height:var(--tap); padding:12px 16px; background:var(--accent); color:#fff; cursor:pointer; }
button.ghost { background:#d9e4ef; color:var(--ink); }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.actions button { flex:1 1 150px; }
.hidden { display:none !important; }
.icons { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; min-height:110px; }
.die { width:92px; height:92px; border-radius:16px; border:2px solid #c5d3e2; background:#f7fbff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.die .emoji { font-size:2rem; }
.cover { background:#111; color:#eee; min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:14px; }
.cover .count { font-size:4rem; }
.scene { position:relative; height:min(58vh,420px); border-radius:14px; overflow:hidden; border:1px solid #c9d4e0; }
.scene.kitchen { background:linear-gradient(#f3e2c8,#e8c9a0); }
.scene.desk { background:linear-gradient(#d7e3ef,#b9c9d8); }
.scene.entry { background:linear-gradient(#e6ddd0,#cbbda8); }
.token { position:absolute; width:52px; height:52px; border:0; background:transparent; font-size:1.7rem; cursor:pointer; }
.token.found { outline:3px solid var(--ok); border-radius:10px; background:rgba(255,255,255,.6); }
.note { font-size:.8rem; color:var(--muted); }
.wrapbox { background:#f4f8fb; padding:12px; border-radius:10px; margin:12px 0; }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
td,th { border-bottom:1px solid #e2e8ef; padding:8px 6px; text-align:left; }
.howto { background:#f6f1e6; padding:10px 12px; border-radius:10px; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>Hold-Find-Plan</h1>
  <p>v0.3 &middot; physical / digital / hybrid &middot; not a medical device &middot; no patient data</p>
</header>
<main>
<section id="setup" class="card">
  <p class="howto">Three models, one protocol (encode &rarr; cover &rarr; delay &rarr; find &rarr; wrap). Print the <a href="physical.html">physical pack</a>. Read <a href="TEST.md">TEST.md</a> before you call anything validated.</p>
  <div class="row">
    <div>
      <label for="mode">Model</label>
      <select id="mode">
        <option value="P">All physical (paper + cubes)</option>
        <option value="D">All digital (icons + scene on screen)</option>
        <option value="A" selected>Hybrid A (physical cubes + digital scene)</option>
        <option value="B">Hybrid B (digital icons + paper scene)</option>
      </select>
    </div>
    <div>
      <label for="pack">Scene pack</label>
      <select id="pack">
        <option value="kitchen">Home / kitchen</option>
        <option value="desk">Work / desk</option>
        <option value="entry">Entryway</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div><label for="n">Items to hold (n)</label>
      <select id="n"><option>2</option><option selected>3</option><option>4</option></select></div>
    <div><label for="encode">Encode seconds</label>
      <select id="encode"><option>3</option><option selected>5</option><option>8</option></select></div>
  </div>
  <div class="row">
    <div><label for="delay">Delay seconds</label>
      <select id="delay"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
    <div><label for="wrap">Wrap</label>
      <select id="wrap">
        <option>Find only</option>
        <option>Reverse</option>
        <option>Skip first</option>
        <option selected>Sentence</option>
        <option>Two-step</option>
        <option>Which first</option>
      </select></div>
  </div>
  <p class="note" id="modeHelp"></p>
  <div class="actions">
    <button type="button" id="start">Start trial</button>
    <button type="button" class="ghost" id="toLog">Jump to log</button>
  </div>
</section>
<section id="encode" class="card hidden">
  <p id="encodeHelp"></p>
  <div class="icons" id="iconRow"></div>
  <p class="note" id="encodeCount"></p>
</section>
<section id="cover" class="card hidden">
  <div class="cover"><div>Hold. Do not peek.</div><div class="count" id="coverCount">5</div></div>
</section>
<section id="find" class="card hidden">
  <p id="findHelp"></p>
  <div class="wrapbox" id="wrapPrompt"></div>
  <div class="scene" id="scene"></div>
  <p class="note" id="foundLine"></p>
  <div class="actions">
    <button type="button" id="markWrap">Wrap complete</button>
    <button type="button" class="ghost" id="markWrapNo">Wrap not complete</button>
  </div>
</section>
<section id="log" class="card hidden">
  <h2 style="margin:0 0 8px;font-size:1.05rem">Session log</h2>
  <table><thead><tr><th>#</th><th>model</th><th>n</th><th>delay</th><th>found</th><th>wrap</th><th>set</th></tr></thead><tbody id="logBody"></tbody></table>
  <textarea id="logText" class="hidden" rows="5" readonly></textarea>
  <div class="actions">
    <button type="button" class="ghost" id="copyLog">Copy log</button>
    <button type="button" class="ghost" id="next">Next trial</button>
  </div>
</section>
</main>
<script>
const LEX=[{id:'mug',name:'mug',emoji:'\u2615'},{id:'key',name:'key',emoji:'\ud83d\udd11'},{id:'phone',name:'phone',emoji:'\ud83d\udcf1'},{id:'apple',name:'apple',emoji:'\ud83c\udf4e'},{id:'book',name:'book',emoji:'\ud83d\udcd6'},{id:'shoe',name:'shoe',emoji:'\ud83d\udc5f'},{id:'hat',name:'hat',emoji:'\ud83c\udfa9'},{id:'glasses',name:'glasses',emoji:'\ud83d\udc53'},{id:'pencil',name:'pencil',emoji:'\u270f\ufe0f'},{id:'bag',name:'bag',emoji:'\ud83d\udc5c'},{id:'clock',name:'clock',emoji:'\u23f0'},{id:'scissors',name:'scissors',emoji:'\u2702\ufe0f'}];
const FOILS=[{name:'bread',emoji:'\ud83c\udf5e'},{name:'lamp',emoji:'\ud83d\udca1'},{name:'chair',emoji:'\ud83e\ude91'},{name:'leaf',emoji:'\ud83c\udf43'},{name:'coin',emoji:'\ud83e\ude99'},{name:'cup',emoji:'\ud83c\udf75'}];
const HELP={P:'Print physical.html. Cubes, folder, paper scene, paper log. This page only times the delay.',D:'All on screen. Icons hide. No peek. Then tap the scene.',A:'Name real cubes. Folder covers them. Phone shows the scene after the delay.',B:'Name on-screen icons. They hide. Search a paper card.'};
let state={trial:0,set:[],found:new Set(),timer:null}; let rows=[];
const $=id=>document.getElementById(id);
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function show(id){['setup','encode','cover','find','log'].forEach(s=>$(s).classList.toggle('hidden', s!==id && !(id==='find'&&s==='log'))); if(id==='find')$('log').classList.remove('hidden'); window.scrollTo(0,0);}
function tick(sec,onTick,onDone){ if(state.timer) clearInterval(state.timer); let n=sec; onTick(n); state.timer=setInterval(()=>{n--; onTick(n); if(n<=0){clearInterval(state.timer); state.timer=null; onDone();}},1000); }
$('mode').onchange=()=>$('modeHelp').textContent=HELP[$('mode').value];
$('modeHelp').textContent=HELP.A;
$('start').onclick=begin;
$('toLog').onclick=()=>{$('log').classList.remove('hidden'); $('log').scrollIntoView({behavior:'smooth'});};
$('next').onclick=()=>show('setup');
$('copyLog').onclick=async()=>{ const t='trial\tmodel\tn\tdelay\tfound\twrap\tset\n'+rows.map(r=>r.join('\t')).join('\n'); $('logText').value=t; try{await navigator.clipboard.writeText(t); alert('Log copied');}catch(e){$('logText').classList.remove('hidden'); $('logText').select();}};
function begin(){
  const mode=$('mode').value;
  if(mode==='P'){ window.location.href='physical.html'; return; }
  state.set=shuffle(LEX).slice(0, +$('n').value);
  state.found=new Set();
  $('encodeHelp').textContent=HELP[mode];
  $('iconRow').innerHTML=state.set.map(x=>`<div class="die"><div class="emoji">${x.emoji}</div><div class="name">${x.name}</div></div>`).join('');
  show('encode');
  tick(+$('encode').value, left=>$('encodeCount').textContent=left+' seconds to encode', startCover);
}
function startCover(){ show('cover'); tick(+$('delay').value, left=>$('coverCount').textContent=left, startFind); }
function startFind(){
  const mode=$('mode').value;
  $('findHelp').textContent=mode==='B'?'Search the paper card. Then mark the wrap.':'Click or tap the held items.';
  $('wrapPrompt').textContent='Wrap: '+$('wrap').value+' \u00b7 Held: '+state.set.map(x=>x.name).join(', ');
  const scene=$('scene'); scene.className='scene '+$('pack').value; scene.innerHTML='';
  if(mode==='B'){
    scene.innerHTML='<p style="padding:20px">Paper scene on the table. Digital icons stay hidden.</p>';
    state.set.forEach(x=>state.found.add(x.id));
  } else {
    const tokens=state.set.map(x=>({...x,target:true})).concat(shuffle(FOILS).slice(0,5).map(x=>({...x,id:x.name,target:false})));
    shuffle(tokens).forEach((tok,i)=>{
      const el=document.createElement('button'); el.type='button';
      el.className='token'+(tok.target?'':' foil'); el.textContent=tok.emoji;
      el.style.left=(6+(i*14)%78)+'%'; el.style.top=(10+(i*19)%68)+'%';
      el.onclick=()=>{ if(!tok.target) return; state.found.add(tok.id); el.classList.add('found'); updateFound(); };
      scene.appendChild(el);
    });
  }
  updateFound(); show('find');
}
function updateFound(){ $('foundLine').textContent='Found '+state.found.size+' of '+state.set.length; }
function finish(ok){
  state.trial++;
  rows.push([state.trial,$('mode').value,$('n').value,$('delay').value,state.found.size+'/'+state.set.length,ok?'Y':'N',state.set.map(x=>x.name).join(',')]);
  $('logBody').innerHTML=rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  $('log').classList.remove('hidden'); show('setup');
}
$('markWrap').onclick=()=>finish(true);
$('markWrapNo').onclick=()=>finish(false);
</script>
</body>
</html>
